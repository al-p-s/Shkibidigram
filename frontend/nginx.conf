server {
    listen 80;
    server_name shkibidigram.d-n-s.name;
    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shkibidigram.d-n-s.name;

    ssl_certificate /etc/letsencrypt/live/shkibidigram.d-n-s.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shkibidigram.d-n-s.name/privkey.pem;

    # Статика
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API (HTTP)
    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebRTC HTTP endpoints
    location /webrtc/ {
        proxy_pass http://app:8000/webrtc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebRTC WebSocket (важно! отдельный location для WebSocket)
    location /webrtc/ws {
        proxy_pass http://app:8000/webrtc/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Основной WebSocket для чата
    location /ws {
        proxy_pass http://app:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}